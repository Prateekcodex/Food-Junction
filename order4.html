<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/x-icon">
    <title>Document</title>
    <link rel="stylesheet" href="order.css">

    <script>
        function showAlert() {
            alert("Your order has been placed successfully. Thanks!");
        }
    </script>



<style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');


*{
    box-sizing: border-box;
    padding: 0;
    margin: 0;
}
body{
    font-family: 'Poppins', sans-serif;
}
.banner{
    min-height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("./assets/images/banner-img.jpg") center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    padding-bottom: 20px;
}
.card-container{
    display: grid;
    grid-template-columns: 420px 420px;
}
.card-img{
    background: url("./assets/images/chicken.jpg") center/cover no-repeat;
}
.banner h2{
    padding-bottom: 40px;
    margin-bottom: 20px;
}
.card-content{
    background: #fff;
    height: 350px;
}
.card-content h3{
    text-align: center;
    color: #000;
    padding: 25px 0 10px 0;
    font-size: 26px;
    font-weight: 500;
}
.form-row{
    display: flex;
    width: 90%;
    margin: 0 auto;
}
form select, form input{
    display: block;
    width: 100%;
    margin: 15px 12px;
    padding: 5px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    outline: none;
    border: none;
    border-bottom: 1px solid #eee;
    font-weight: 300;
}
form input[type = text], form input[type = number], form input::placeholder, select{
    color: black;
}
form input[type = submit]{
    color: #fff;
    background: #f2745f;
    padding: 12px 0;
    border-radius: 4px;
    cursor: pointer;
}
form input[type = submit]:hover{
    opacity: 0.9;
}
@media(max-width: 992px){
    .card-container{
        grid-template-columns: 100%;
        width: 100vw;
    }
    .card-img{
        height: 330px;
    }
}
</style>




</head>
    <body>
        
        <section class = "banner">
            <h2>THE CHICKEN THRONE</h2>
            <div class = "card-container">
                <div class = "card-img">
                    <!-- image here -->
                     <!-- <img src="./assets/images/card-img.jpg" width="100" height="100" alt="image"> -->
                </div>

                <div class = "card-content">
                    <h3>Order Your Chicken</h3>
                    <form>
                        <div class = "form-row">
                            
                            <select title = "Chicken" required>
                                <option value = "select">Chicken Types</option>
                                <option value = "Classic">Classic Fried Chicken</option>
                                <option value = "Grilled">Grilled Chicken</option>
                                <option value = "Chicken">Chicken Curry</option>
                                <option value = "Chicken">Rotisserie Chicken</option>
                                <option value = "Chicken">Chicken Stir Fry</option>
                            </select>

                            <select title = "Curry Style" required>
                                <option value = "Curry">Curry Style</option>
                                <option value = "Chicken">Indian-style butter chicken</option>
                                <option value = "Thai">Thai green curry</option>
                                <option value = "curry">Caribbean jerk chicken curry</option>
                            </select>
                        </div>

                        <div class = "form-row">
                            <select title = "souce" required>
                                <option value = "Sauce Options">Sauce Options</option>
                                <option value = "Teriyaki">Teriyaki</option>
                                <option value = "GSweet and Sour">Sweet and Sour</option>
                                <option value = "Black Bean Garlic Sauce">Black Bean Garlic Sauce</option>
                            </select>

                            <select title = "Flavours" required>
                                <option value = "Flavours">Flavours Option</option>
                                <option value = "Lemon herb">Lemon herb</option>
                                <option value = "Garlic butter">Garlic butter</option>
                                <option value = "Barbecue">Barbecue</option>
                            </select>
                        </div>

                        <div class = "form-row">
                            <select title = "Topping" required>
                                <option value = "Topping">Toppings</option>
                                <option value = "Cheese">Cheese</option>
                                <option value = "Grilled Onions">Grilled Onions</option>
                                <option value = "Avocado">Avocado</option>
                                <option value = "Pickles">Pickles</option>
                            </select>

                            <select title = "Salad Option" required>
                                <option value = "Salad Option">Salad Option</option>
                                <option value = "Extra">Chicken Cobb Salad</option>
                                <option value = "Extra Meat">Asian Chicken Salad</option>
                                <option value = "Gluten-Free Dough">Side salad or onion rings</option>
                            </select>

                        </div>

                        <div class="form-row">
                            <select title = "Spice Level" required>
                                <option value = "Spice Level">Spice Level</option>
                                <option value = "Mild">Mild</option>
                                <option value = "Medium">Medium</option>
                                <option value = "Extra Hot">Extra Hot</option>
                            </select>

                            <input type = "submit" value = "ORDER NOW" onclick="redirectToPayment()">
                        </div>

                        

                    </form>
                </div>
            </div>
        </section>
        
        
    </body>
</html>
